controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController


# ---------------------------
# HUSKY DIFF DRIVE CONTROLLER
# ---------------------------
diff_drive_controller:
  ros__parameters:
    publish_rate: 30.0

    left_wheel_names: ["front_left_wheel_joint", "rear_left_wheel_joint"]
    right_wheel_names: ["front_right_wheel_joint", "rear_right_wheel_joint"]

    wheel_separation: 0.84
    wheels_per_side: 2
    wheel_radius: 0.160
    cmd_vel_timeout: 0.5

    # Humble's nav2_bringup velocity_smoother publishes plain
    # geometry_msgs/Twist on its output topic, not TwistStamped -
    # diff_drive_controller's default (true) expects TwistStamped on
    # the same topic name, so with the default nothing subscribed to
    # nav2's output actually connects (DDS won't match mismatched
    # types even with matching topic names) and the robot never moves.
    use_stamped_vel: false

    odom_frame_id: odom
    base_frame_id: base_footprint

    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    open_loop: false
    enable_odom_tf: true
    publish_cmd: true
    publish_wheel_data: true

    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.max_velocity: 2.2
    linear.x.min_velocity: -2.2
    linear.x.max_acceleration: 1.0

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0
    angular.z.max_acceleration: 1.0
    angular.z.min_acceleration: -1.0


# ---------------------------
# UR10 TRAJECTORY CONTROLLER
# ---------------------------
joint_trajectory_controller:
  ros__parameters:
    joints:
      - ur10_shoulder_pan_joint
      - ur10_shoulder_lift_joint
      - ur10_elbow_joint
      - ur10_wrist_1_joint
      - ur10_wrist_2_joint
      - ur10_wrist_3_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false

    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      ur10_shoulder_pan_joint: { trajectory: 0.2, goal: 0.1 }
      ur10_shoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
      ur10_elbow_joint: { trajectory: 0.2, goal: 0.1 }
      ur10_wrist_1_joint: { trajectory: 0.2, goal: 0.1 }
      ur10_wrist_2_joint: { trajectory: 0.2, goal: 0.1 }
      ur10_wrist_3_joint: { trajectory: 0.2, goal: 0.1 }
