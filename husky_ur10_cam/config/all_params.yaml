# Single place to tune the object search + STC coverage + active
# perception behavior.
#
# object_search_action_server.py, active_perception_node.py and
# qwen_vlm_server.py all load this automatically on `ros2 run` (see each
# script's main()/_default_params_file()). stc_cpp's kruskal_stc_node
# loads it via stc.launch.py's `params_file` argument (default: this
# file - point it elsewhere with params_file:=/path/to/override.yaml).
#
# Anything left out here just falls back to the node's own code-level
# default - see ee_camera_environment_scan.py's parse_args() and
# stc_cpp/stc_cpp/stc.py's declare_parameter() calls.

# What to search for - the ONE place to set this. ROS 2's "/**" applies a
# shared ros__parameters block to every node that loads this file (not
# just one), so object_search_action_server, kruskal_stc_node and
# active_perception_node all read the same target_objects here instead of
# each having their own copy (they can't reference each other's values -
# ROS 2's yaml parser explicitly rejects YAML aliases/anchors).
/**:
  ros__parameters:
    target_objects: ["cup", "book"]

object_search_action_server:
  ros__parameters:
    # Phase 1 sweep geometry
    helix_radius: 0.6          # meters, orbit radius around base_link
    helix_height: 1.0          # meters, orbit height
    helix_center: [0.0, 0.0]   # meters, orbit center (x, y) in base_link
    tilt_up_deg: 5.0
    tilt_down_deg: 30.0
    num_sectors: 16
    tilts_per_sector: 2

    # Phase 2 investigation budget
    max_tries: 5
    revisit_attempts: 3
    phase2_max_steps: 20
    max_object_distance: 3.0   # meters; farther candidates are skipped
    approach_standoff: 0.15    # meters, stop this close during 3D approach
    approach_max_step: 0.5     # meters, cap on a single 3D approach move

    # Misc
    skip_phase1: false
    skip_phase2: false
    skip_start_home: false
    skip_return_home: false
    dwell: 0.5                 # seconds to settle before each capture
    group: "ur10_ur_manipulator"
    vel_scale: 1.0
    accel_scale: 1.0

    # Machine-specific paths - uncomment to override the code defaults
    # (~/husky_ws/yolov8n.pt, ~/husky_ws/detections). Qwen2.5-VL is now
    # loaded by qwen_vlm_server (see below), not this node.
    # yolo_weights: "/home/you/husky_ws/yolov8n.pt"
    # save_detections_dir: "/home/you/husky_ws/detections"

kruskal_stc_node:
  ros__parameters:
    # true = search when active_perception_node's latest chassis-camera
    # hint names a direction at a new major cell; a cell with no hint gets
    # no search at all. false = never search.
    enable_object_search: true
    search_max_object_distance: 5.0   # <= 0.0 uses object_search_action_server's own default
    subcell_per_cell: 2               # major cell size, x subcell (robot-footprint-sized)

active_perception_node:
  ros__parameters:
    tick_interval_sec: 2.0        # how often to sample the cameras + ask the VLM
    max_check_distance_m: 5.0     # a VLM-flagged direction is only a real hint if
                                   # something's within this range there (depth-measured)

qwen_vlm_server:
  ros__parameters:
    qwen_model: "Qwen/Qwen2.5-VL-7B-Instruct"   # HF model id/path, shared by every VLM caller
